# ── Core ─────────────────────────────────────────────────────────────────────
set -g mouse on
set -g default-terminal "tmux-256color"
# Truecolor for xterm-family and *256col* terminals (Ghostty is xterm-ghostty).
# '*:Tc' also matched TERM=linux and broke colors on the Linux text console.
# linux*:AX@ is the tmux default, restated because -g replaces the list.
set -g terminal-overrides "linux*:AX@,xterm*:Tc,*256col*:Tc"
# The tmux default feature list, plus RGB for the 256-color terminal types.
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-256color:RGB,tmux-256color:RGB,screen-256color:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 100000
set -g focus-events on
set -g mode-keys vi
# An agent box keeps its server when no session or client remains.
set -g exit-empty off
set -g exit-unattached off
# OSC 52 copy and image paste reach the outer terminal (clipboard-bridge).
set -g set-clipboard on
set -g allow-passthrough on

# ── Pane environment ─────────────────────────────────────────────────────────
# FORCE_COLOR stays unset: it makes Node tools write ANSI codes into the piped
# output that agents read.
set-environment -gu NO_COLOR
set-environment -g COLORTERM truecolor
set-environment -g CLICOLOR 1

# ── Session chrome ────────────────────────────────────────────────────────────
# Catppuccin Mocha palette, drawn natively (no theme plugin).
# The header reads left-to-right: session, adaptive window tabs, then host/time.
# Pane headers carry the active command and folder context.
set -g status-position top
set -g status-interval 15
set -g status-justify left
set -g status-style 'fg=#cdd6f4,bg=#181825'
set -g status-left-style 'fg=#cdd6f4,bg=#181825'
set -g status-right-style 'fg=#cdd6f4,bg=#181825'
set -g status-left-length 24
set -g status-right-length 22
set -g status-left '#[fg=#89b4fa,bold] #S '
set -g status-right '#[fg=#a6adc8]@#{host_short} #[fg=#6c7086]· #[fg=#cdd6f4,nobold]%H:%M '
set -g window-status-style 'fg=#6c7086,bg=#181825'
set -g window-status-current-style 'fg=#181825,bg=#89b4fa,bold'
set -g window-status-format '#{?#{e|>=:#{client_width},120}, #I #{=|12|...:#{window_name}} , #I }'
set -g window-status-current-format '#{?#{e|>=:#{client_width},120}, #I #{=|12|...:#{window_name}} , #I #{=|12|...:#{window_name}} }'
set -g window-status-separator '#[fg=#45475a]·#[default]'
set -g window-status-activity-style 'fg=#f9e2af,bg=#181825'
set -g window-status-bell-style 'fg=#f38ba8,bg=#181825,bold'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
set -g pane-border-status top
set -g pane-border-format ' #[fg=#6c7086]#P #[fg=#cdd6f4]#{pane_current_command} #[fg=#6c7086]· #{=|24|...:#{b:pane_current_path}} '
set -g message-style 'fg=#89dceb,bg=#181825,align=centre'
set -g message-command-style 'fg=#89dceb,bg=#181825,align=centre'
set -g mode-style 'fg=#cdd6f4,bg=#45475a,bold'

# ── Keys ─────────────────────────────────────────────────────────────────────
# Resize panes (prefix + key, repeatable). l replaces the default last-window.
bind -r H resize-pane -L 10
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 10
bind -r h resize-pane -L 2
bind -r j resize-pane -D 1
bind -r k resize-pane -U 1
bind -r l resize-pane -R 2

# Layouts. = and - replace the default choose-buffer and delete-buffer.
bind = select-layout even-horizontal
bind - select-layout even-vertical
bind \\ select-layout main-vertical
bind _ select-layout main-horizontal
bind + select-layout tiled

# Session-first chooser: sessions stay compact and collapsed until expanded.
set -g @session-switcher-format '#{?session_format,#{?session_attached,#[fg=#a6e3a1]@#[default] ,  }#[bold]#{session_windows}w#[default]  #[fg=#a6adc8]#{=|26|...:#{b:session_path}}#[default],  #{?window_active,#[fg=#f9e2af]*#[default] ,  }#{=|22|...:window_name}  #[fg=#6c7086]#{=|30|...:#{b:pane_current_path}}#[default]}'
bind s choose-tree -ZNs -K '' -O time -F "#{E:@session-switcher-format}"

# ── Plugins (TPM) ────────────────────────────────────────────────────────────
# tmux/install.sh clones each listed plugin; prefix + I also installs them.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# clipboard-bridge sets @override_copy_command and @yank_action, so it loads
# before tmux-yank reads them.
set -g @plugin 'drewstone/clipboard-bridge'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-heal runs the tmux-resurrect save every 15 minutes; tmux-continuum stays
# off because its status hook starts a shell per client on every refresh.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir '~/.tmux/resurrect'
# 2026-09-03: 'node' removed. Codex's TUI is a node process, so a crash restore
# re-ran `codex resume <id>` in four sessions and their /goal missions worked
# unattended for 8 h (PR merges, a Hetzner member removal). A script never
# restores an agent; it reopens the shell and a person resumes the agent.
set -g @resurrect-processes 'ssh,npm,pnpm,yarn,bun,python3,bash,zsh,fish'

# Synchronous, so the bindings below override the plugins' bindings.
run '~/.tmux/plugins/tpm/tpm'

# ── Clipboard bindings (after TPM) ───────────────────────────────────────────
run-shell -b "tmux bind-key -T copy-mode-vi C-c send-keys -X cancel"
# Double and triple click copy a word or a line through the OSC 52 bridge.
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H; send-keys -X select-word; send-keys -X copy-pipe-no-clear $HOME/.tmux/plugins/clipboard-bridge/scripts/osc52-copy.sh"
bind -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -H; send-keys -X select-line; send-keys -X copy-pipe-no-clear $HOME/.tmux/plugins/clipboard-bridge/scripts/osc52-copy.sh"
# Ctrl-V pastes the Mac clipboard (text or image) through the reverse tunnel on
# a Linux box. It takes Ctrl-V from every pane program there, so the Mac, which
# has its own paste key, keeps Ctrl-V.
if-shell '[ "$(uname -s)" = Linux ]' {
  bind -T root C-v run-shell "$HOME/.tmux/plugins/clipboard-bridge/scripts/clipboard-paste.sh '19988' '$HOME/.tmux/clipboard/images' '20'"
}
