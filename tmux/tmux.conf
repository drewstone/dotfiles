# ── Core ─────────────────────────────────────────────────────────────────────
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on

# ── Session chrome ────────────────────────────────────────────────────────────
# The header reads left-to-right: session, adaptive window tabs, then host/time.
# Pane headers carry the active command and folder context.
set -g status-position top
set -g status-interval 15
set -g status-justify left
set -g status-style 'fg=#cdd6f4,bg=#181825'
set -g status-left-style 'fg=#cdd6f4,bg=#181825'
set -g status-right-style 'fg=#cdd6f4,bg=#181825'
set -g status-left-length 24
set -g status-right-length 22
set -g status-left '#[fg=#89b4fa,bold] #S '
set -g status-right '#[fg=#a6adc8]@#{host_short} #[fg=#6c7086]· #[fg=#cdd6f4,nobold]%H:%M '
set -g window-status-style 'fg=#6c7086,bg=#181825'
set -g window-status-current-style 'fg=#181825,bg=#89b4fa,bold'
set -g window-status-format '#{?#{e|>=:#{client_width},120}, #I #{=|12|...:#{window_name}} , #I }'
set -g window-status-current-format '#{?#{e|>=:#{client_width},120}, #I #{=|12|...:#{window_name}} , #I #{=|12|...:#{window_name}} }'
set -g window-status-separator '#[fg=#45475a]·#[default]'
set -g window-status-activity-style 'fg=#f9e2af,bg=#181825'
set -g window-status-bell-style 'fg=#f38ba8,bg=#181825,bold'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
set -g pane-border-status top
set -g pane-border-format ' #[fg=#6c7086]#P #[fg=#cdd6f4]#{pane_current_command} #[fg=#6c7086]· #{=|24|...:#{b:pane_current_path}} '
set -g message-style 'fg=#89dceb,bg=#181825,align=centre'
set -g message-command-style 'fg=#89dceb,bg=#181825,align=centre'

# ── Plugins (TPM) ────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'drewstone/clipboard-bridge'

# TPM bootstrap — install with: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
run -b '~/.tmux/plugins/tpm/tpm'
