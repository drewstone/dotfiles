# ASMedia ASM105x USB-SATA bridge (174c:55aa) holding the trace archive disk on
# drew-gtr-pro. Under sustained random reads its UAS mode stalled, the kernel
# reset the port, and the disk re-enumerated mid-capture (2026-10-06 05:21Z).
# "u" makes usb-storage claim it instead of uas. Applies the next time the
# module loads (boot or re-plug); installing it never rebinds the live disk.
options usb-storage quirks=174c:55aa:u
