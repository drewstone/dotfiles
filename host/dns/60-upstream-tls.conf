# Installed by dotfiles host/install.sh. Global upstream DNS over TLS for systemd-resolved.
#
# drew-gtr-pro reaches the internet only over Wi-Fi, which drops about 2% of packets. Every UDP
# query that loses a packet waited out a 5 s timeout, so on 2026-10-06 one lookup in five that
# missed the cache took over 1 s (p99 15 s) and some failed. TLS runs over TCP, which resends a
# lost segment in about 200 ms. These servers answer in parallel with the Wi-Fi link's DHCP server
# (the router), and resolved takes the first answer. "opportunistic" falls back to plain DNS when a
# server refuses TLS. Stale answers are served for a day when every upstream fails.
[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 8.8.8.8#dns.google 8.8.4.4#dns.google
DNSOverTLS=opportunistic
StaleRetentionSec=1d
