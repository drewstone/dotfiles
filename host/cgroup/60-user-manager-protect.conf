# /etc/systemd/system/user@.service.d/60-prod-protect.conf (dotfiles host/install.sh).
# The user manager runs the host's production services (prod.slice) and the capped agent gates (gates.slice,
# host/gates); agent shells and tmux panes run beside it in session scopes. A higher weight than those scopes, and
# memory protection passed down to prod.slice, keep Solve, the trace capture and the fleet pages responsive while
# agents load the host (2026-10-06: load 896, a five-minute freeze).
[Service]
CPUWeight=400
MemoryLow=12G
