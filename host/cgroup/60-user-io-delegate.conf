# Installed by host/install.sh. A user manager (user@<uid>.service) delegates only cpu, memory and pids by
# default, so a user unit's IOReadBandwidthMax/IOWriteBandwidthMax/IOReadIOPSMax are ignored. Delegating io
# makes io.max apply. IOWeight still does nothing under the mq-deadline and none schedulers (no BFQ or
# io.cost); use the bandwidth or IOPS limits.
# Takes effect when a user manager next starts; nothing running is restarted.
[Service]
Delegate=cpu memory pids io
