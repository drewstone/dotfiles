# Installed by host/install.sh. A user manager (user@<uid>.service) delegates only cpu, memory and pids by
# default, so a user unit's IOReadBandwidthMax/IOWriteBandwidthMax/IOReadIOPSMax were ignored: on GTR the
# trace capture and restic units could not cap their writes to the SMR archive drive (sda at ~100%,
# global IO pressure 13-23%, 2026-10-26). Delegating io makes io.max apply. IOWeight still does nothing on
# GTR's mq-deadline and none schedulers (no BFQ or io.cost); use the bandwidth or IOPS limits.
# Takes effect when a user manager next starts; nothing running is restarted.
[Service]
Delegate=cpu memory pids io
