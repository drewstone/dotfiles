# The watchdog's root-write probe runs syncfs on /, which waits for every dirty
# page on the filesystem. With the default 20% ratio, 121 GB of RAM allows about
# 24 GB of dirty data; the 2026-09-27 06:50Z reboot came with 5.2 GiB dirty and
# 538 ms NVMe waits. With these bounds a sync flushes at most about 1 GB, and
# the heavy writer is throttled instead of the whole host.
vm.dirty_background_bytes = 268435456
vm.dirty_bytes = 1073741824
