# Raise the per-user inotify watch limit (65536 on these hosts).
# Every Claude session runs an fff-mcp file index that holds about 1,000
# watches, and Claude itself holds more. GTR reached 62,672 of
# 65,536 (claude 34,877, fff-mcp 26,690) with about 26 sessions, so new
# sessions lost file watching. A watch costs about 1 KiB of kernel memory,
# so the ceiling below is about 512 MiB.
fs.inotify.max_user_watches = 524288
