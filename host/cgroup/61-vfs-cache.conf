# Keep inodes and dentries cached in preference to file pages (default 100).
# The trace archive's capture lstat's millions of files on the USB HDD at
# /mnt/traces; an inode that fell out of the cache costs a seek, about 100 a
# second. On 2026-10-06 the cache held 2.3M inodes under memory pressure and a
# walk read about 115 a second; at 50, with the tree prewarmed, about 1,200.
# Inodes and dentries are still reclaimed under pressure, only less eagerly.
vm.vfs_cache_pressure = 50
