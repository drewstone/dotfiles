# Nix workers execute in the daemon cgroup, outside their CI client runner.
# host/install.sh renders CI_WEIGHT from the same policy as ci.slice; applying
# the weight live leaves active builds running. No CPU quota is introduced.
# Rollback: remove this installed drop-in and run systemctl daemon-reload, then
# systemctl set-property --runtime nix-daemon.service CPUWeight=100.
[Service]
CPUWeight=@CI_WEIGHT@
