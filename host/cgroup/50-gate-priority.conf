# Beelinks only. CI runner jobs (ci.slice/ci-runners.slice, 29 runners per
# host) yield the CPU to merge gates under contention. At 21:30Z
# CI held 4-5 cores on each beelink while gates waited; weights only matter when
# the CPU is contended, so idle CI still runs at full speed. deploy.slice
# (deploy runners) keeps the default 100.
# Rollback: sudo rm /etc/systemd/system/ci.slice.d/50-gate-priority.conf &&
#   sudo systemctl daemon-reload && sudo systemctl set-property --runtime ci.slice CPUWeight=100
# host/install.sh renders this template from the shared CI/Nix weight policy.
[Slice]
CPUWeight=@CI_WEIGHT@
