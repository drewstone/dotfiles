# Agent processes on this host land in user.slice: tailscale ssh sessions,
# tmux panes (the user manager's tmux-spawn scopes), CI runner jobs (user@983)
# and the hostlab VMs they start. This caps them together. The services that
# keep the host alive (watchdog, tailscaled, journald, sshd) stay in
# system.slice and win under contention.
#
# There is no MemoryHigh. In a VM proof on 2026-09-28, a hog held under
# MemoryHigh was throttled for 240 s and never reached MemoryMax, and the
# throttle stalled every session in the slice, ssh included. With MemoryMax
# alone the kernel OOM-killed the hog inside the slice in 2 s, while a
# system.slice root-write probe stayed at 253 ms.
# There is no IOWeight either: the NVMe uses the `none` scheduler without
# io.cost, so io.weight does nothing here. vm.dirty_* bounds the writeback.
[Slice]
MemoryMax=108G
MemorySwapMax=24G
CPUWeight=30
