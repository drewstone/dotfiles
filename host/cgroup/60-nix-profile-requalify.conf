# Beelinks only. Nix profile admission (agent-container infra/nix/README.md)
# refuses after any nix-daemon restart or boot until root re-qualifies the live
# daemon. After both Beelinks rebooted on 2026-10-25 every host profile
# publication refused until it was done by hand. Re-qualify on every start;
# a failure never blocks the daemon (the leading "-").
# Rollback: sudo rm /etc/systemd/system/nix-daemon.service.d/60-nix-profile-requalify.conf
#   && sudo systemctl daemon-reload
[Service]
ExecStartPost=-/usr/local/libexec/nix-profile-requalify
