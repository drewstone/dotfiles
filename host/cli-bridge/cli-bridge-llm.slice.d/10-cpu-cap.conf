# Cap all cli-bridge LLM scopes (discovery-lab pursuits incl. the kissat
# solver campaign, and pr-reviewer runs) at 24 of 32 cores so interactive
# agent sessions keep ~8 cores of headroom. Load reached 212 on 2026-09-22.
# cpuset is not delegated to the user manager, so AllowedCPUs= would be
# ignored; CPUQuota enforces the share instead.
[Slice]
CPUQuota=2400%
CPUWeight=50
