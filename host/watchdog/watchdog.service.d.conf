# Installed by ~/dotfiles/host/install.sh.
# The daemon holds an armed kernel watchdog. If it dies without a clean stop
# the timer fires and the box resets, so it must survive memory pressure and
# come back fast.
# The daemon keeps running when it cannot open its device, so a missing
# /dev/watchdog-softdog must fail the unit instead of leaving it "active".
# The Debian unit fails on purpose after every stop so that OnFailure starts
# wd_keepalive. wd_keepalive conflicts with this unit and cancels a restart.
# The softdog disarms on a clean close (nowayout is off), so clear that hand-off
# and treat exit status 1 as a clean stop, as drew-gtr-pro's hand-made
# override did.
[Service]
ExecStopPost=
SuccessExitStatus=0 1
OOMScoreAdjust=-1000
Restart=on-failure
RestartSec=5
ExecStartPre=/usr/bin/udevadm settle --timeout=30
ExecStartPre=/usr/bin/test -c /dev/watchdog-softdog
