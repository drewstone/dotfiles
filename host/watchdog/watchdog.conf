# Installed by ~/dotfiles/host/install.sh.
# The daemon holds the software kernel watchdog (softdog), named by
# 60-host-guard-watchdog.rules. Tests live in /etc/watchdog.d; root-write blocks
# on a frozen root, test-timeout counts that as a failure, and the kernel timer
# then resets the box within watchdog-timeout seconds.
watchdog-device = /dev/watchdog-softdog
watchdog-timeout = 60
interval = 10
realtime = yes
priority = 1
test-directory = /etc/watchdog.d
test-timeout = 60
repair-timeout = 10
retry-timeout = 60
