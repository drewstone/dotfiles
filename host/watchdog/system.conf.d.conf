# Installed by ~/dotfiles/host/install.sh.
# The watchdog daemon must own the softdog: its root-write test is what resets a
# box whose root filesystem is frozen. PID 1 opens /dev/watchdog0 by default,
# and with no hardware timer loaded the softdog is watchdog0, so any
# RuntimeWatchdogSec setting let PID 1 take it first and locked the daemon out.
# PID 1 may use a hardware timer (named by 60-host-guard-watchdog.rules); with
# none, its runtime watchdog stays idle.
[Manager]
WatchdogDevice=/dev/watchdog-hw
