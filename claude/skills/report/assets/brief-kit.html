    if (!all.length) { h('p', 'sub', p, 'No values yet.'); if (b.note) R.callout(p, { html: b.note }); return; }
    const nice = (m) => { const q = Math.pow(10, Math.floor(Math.log10(m))), f = m / q; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * q; };
    const top = Math.max(...all), bot = Math.min(...all), hi = top > 0 ? nice(top) : bot < 0 ? 0 : 1, lo = bot < 0 ? -nice(-bot) : 0, g = svg(p, W, H, b.title);
    const X = i => L + (labels.length > 1 ? (i / (labels.length - 1)) * (W - L - Rr) : (W - L - Rr) / 2), Y = v => Tp + ((hi - v) / (hi - lo)) * (H - B - Tp);
    [lo, (lo + hi) / 2, hi, 0].filter((v, i, xs) => xs.indexOf(v) === i).forEach(v => { s('line', { x1: L, x2: W - Rr, y1: Y(v), y2: Y(v), stroke: css(v === 0 ? '--rule-2' : '--rule') }, g); s('text', { x: L - 6, y: Y(v) + 3.5, 'text-anchor': 'end', class: 'ax' }, g, `${+v.toFixed(2)}${b.yUnit || ''}`); });
    labels.forEach((label, i) => { if (i % (b.every || 1) === 0) s('text', { x: X(i), y: H - 10, 'text-anchor': 'middle', class: 'ax' }, g, label); });
    (b.series || []).forEach(x => { let run = [];
      const flush = () => { if (run.length > 1) s('polyline', { points: run.join(' '), fill: 'none', stroke: tone(x.tone), 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, g); run = []; };
      x.values.forEach((v, i) => { if (!Number.isFinite(v)) { flush(); return; } run.push(`${X(i)},${Y(v)}`);
        tipOn(s('circle', { cx: X(i), cy: Y(v), r: 4.5, fill: tone(x.tone), stroke: css('--surface'), 'stroke-width': 2 }, g), (x.tips || [])[i] || `${labels[i]} · ${v}${b.yUnit || ''}`); });
      flush(); });
    if ((b.series || []).length > 1) legend(p, b.series.map(x => [x.name, x.tone])); if (b.note) R.callout(p, { html: b.note }); };

  R.steps = (parent, b) => { const p = panel(parent, b); (b.items || []).forEach((x, i) => { const st = h('div', 'step ' + (x.state === 'done' ? '' : x.state || ''), p);
    h('span', 'dot', st, x.state === 'done' ? '✓' : x.state === 'block' ? '!' : String(i + 1)); const w = h('div', 'what', st, x.title); if (x.text) h('span', '', w, x.text); h('span', 'when', st, x.when || ''); }); };

  R.table = (parent, b) => { const p = panel(parent, b), sc = h('div', 'scroll', p), t = h('table', '', sc), hr = h('tr', '', h('thead', '', t)); (b.head || []).forEach(c => h('th', '', hr, c));
    const tb = h('tbody', '', t); (b.rows || []).forEach(r => { const tr = h('tr', '', tb); r.forEach(c => html('td', '', tr, c)); }); note(p, b); };

  R.bets = (parent, b) => { const g = h('div', 'bets', parent); (b.items || []).forEach(x => { const p = h('div', 'panel bet' + (x.lead ? ' lead' : ''), g);
    if (x.tag) h('span', 'tag', p, x.tag); h('h3', '', p, x.title); [['Evidence', x.why], ['Build', x.build], ['Pre-mortem', x.premortem]].forEach(([k, v]) => { if (!v) return; const kv = h('div', 'kv', p); h('b', '', kv, k); h('span', '', kv, v); });
    if (x.target) h('div', 'target', p, x.target); }); };

  R.decisions = (parent, b) => { const g = h('div', 'board', parent); (b.items || []).forEach((x, i) => { const p = h('div', 'panel dec', g); h('span', 'n', p, i + 1); h('h3', '', p, x.title); if (x.text) h('p', '', p, x.text); if (x.rec) html('p', 'rec', p, x.rec); }); };

  // Options for a page that lives on a screen: a fixed theme, the full width, and a reload when its data may change.
  if (S.theme === 'dark' || S.theme === 'light') document.documentElement.setAttribute('data-theme', S.theme);
  if (S.wide) root.classList.add('wide');
  if (S.refresh > 0) setTimeout(() => location.reload(), S.refresh * 1000);
  let drawnAt = 0;
  function draw() {
    drawnAt = window.innerWidth; hatch = 0; root.textContent = '';
    const mast = h('header', 'mast', root);
    const eb = h('div', 'eyebrow', mast); (S.eyebrow || []).forEach(x => h('span', '', eb, x));
    const th = h('h1', 'thesis', mast, S.thesis || ''); if (S.thesisAlert) h('span', 'alert', th, S.thesisAlert);
    if (S.dek) h('p', 'dek', mast, S.dek);
    if (S.hill) h('p', 'dek', mast, `Hill: ${S.hill.metric} · ${S.hill.baseline} → ${S.hill.target}${S.hill.owner ? ' · owner ' + S.hill.owner : ''}`);
    if (S.stats && S.stats.length) { const st = h('div', 'strip', mast); st.style.setProperty('--n', Math.min(S.stats.length, 5)); S.stats.forEach(x => { const d = h('div', '', st); h('span', 'v' + (x.tone ? ' tone-' + x.tone : ''), d, x.v); h('span', 'l', d, x.l); }); }
    (S.sections || []).forEach(sec => { const el = h('section', '', root); if (sec.id) el.id = sec.id; const sh = h('div', 'sh', el); h('span', 'k', sh, sec.key || ''); h('h2', '', sh, sec.title); if (sec.lede) h('p', '', sh, sec.lede); (sec.blocks || []).forEach(b => block(el, b)); });
    if (S.method || S.caveats) { const f = h('footer', 'foot', root); if (S.method) html('p', '', f, '<b>Method.</b> ' + S.method); if (S.caveats) html('p', '', f, '<b>Caveats.</b> ' + S.caveats); }
  }
  draw();
  let pending;
  window.addEventListener('resize', () => { clearTimeout(pending); pending = setTimeout(() => { if (Math.abs(window.innerWidth - drawnAt) > 24) draw(); }, 150); });

  const tip = document.getElementById('tip');
  document.addEventListener('pointermove', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (!t) { tip.hidden = true; return; } tip.textContent = t.getAttribute('data-tip'); tip.hidden = false; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; });
  document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (!t) return; const r = t.getBoundingClientRect(); tip.textContent = t.getAttribute('data-tip'); tip.hidden = false; tip.style.left = r.right + 'px'; tip.style.top = r.top + 'px'; });
})();
</script>
